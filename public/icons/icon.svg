<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <title>Pitch Lab</title>
  <!-- warm-black rounded square ("the vocal booth after hours"), docs/DESIGN.md §1/§3 -->
  <rect width="512" height="512" rx="112" fill="#0E0F13"/>
  <!-- target bar, "locked" state: solid outline + translucent fill (DESIGN.md §8) -->
  <rect x="92" y="200" width="328" height="112" rx="24" fill="#56B4E9" fill-opacity="0.28" stroke="#56B4E9" stroke-width="8"/>
  <line x1="92" y1="256" x2="420" y2="256" stroke="#56B4E9" stroke-opacity="0.55" stroke-width="3"/>
  <!-- pitch trace crossing the target bar and settling dead-centre: glow under-stroke, then core -->
  <path d="M66 344 C 140 344, 176 258, 256 256 C 328 254, 372 236, 452 232" fill="none" stroke="#F2EFE8" stroke-opacity="0.16" stroke-width="28" stroke-linecap="round"/>
  <path d="M66 344 C 140 344, 176 258, 256 256 C 328 254, 372 236, 452 232" fill="none" stroke="#F2EFE8" stroke-width="12" stroke-linecap="round"/>
  <!-- the amber tally light -->
  <circle cx="394" cy="120" r="36" fill="#FFB224"/>
</svg>
